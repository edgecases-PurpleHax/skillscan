name: SkillScan

on:
  push:
    paths:
      - '**/*.md'
      - 'skills/**'
      - '.claude/**'
      - 'skillscan.yml'
      - 'src/**'
  pull_request:
    paths:
      - '**/*.md'
      - 'skills/**'
      - '.claude/**'
      - 'skillscan.yml'
      - 'src/**'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SkillScan
        run: npx tsx src/cli/index.ts scan --sarif --json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .skillscan/skillscan-report.sarif
